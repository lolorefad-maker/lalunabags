<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Luna</title>
<meta name="description" content="La Luna — timeless bags, thoughtful design. حقائب خالدة بتصميم مدروس.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf6ef; --sand:#efe6d7; --paper:#fff; --navy:#12192e; --navy-2:#1c2542;
  --ink:#1b1b1f; --muted:#6f6a60; --gold:#b8873a; --line:#e3d9c8;
  --serif:"Cormorant Garamond","Amiri",serif; --sans:Inter,Cairo,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:Cairo,Inter,sans-serif}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0;line-height:1.35}
html[lang=ar] .hero .eyebrow{margin-bottom:12px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
img,svg{display:block;max-width:100%}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:20px}
.eyebrow{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:.8rem}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.15;letter-spacing:.005em}
.rule{width:34px;height:1px;background:var(--gold);margin:14px 0}

/* top bar */
.top{background:var(--navy);color:var(--sand);position:sticky;top:0;z-index:30}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px}
.logo{font-family:var(--serif);font-size:1.5rem;letter-spacing:.34em;color:var(--sand);text-align:center;padding-inline-start:.34em}
.top nav{display:flex;gap:22px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.top nav a:hover{opacity:1;color:#fff}
.tools{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.pill{background:transparent;border:1px solid #ffffff40;color:var(--sand);border-radius:999px;padding:5px 13px;font-size:.78rem}
.pill:hover{background:#ffffff14}
.cartbtn{position:relative}
.cartbtn b{position:absolute;inset-block-start:-7px;inset-inline-end:-7px;background:var(--gold);color:#fff;font-size:.68rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding-inline:4px}
@media(max-width:760px){.top nav{display:none}.top .wrap{grid-template-columns:auto 1fr auto}.logo{text-align:start;font-size:1.2rem;letter-spacing:.24em}}

/* hero */
.hero{background:linear-gradient(120deg,#e9dcc6,#f6efe2 55%,#efe3cf);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;min-height:540px;gap:20px}
.hero h1{font-size:clamp(2.6rem,6.5vw,4.6rem);margin-bottom:18px}
.hero h1 i{color:var(--gold);font-style:normal}
.hero p{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);max-width:340px;margin-bottom:28px;line-height:1.9}
html[lang=ar] .hero p{letter-spacing:0;font-size:1rem;text-transform:none}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;padding:14px 28px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;transition:background .2s}
html[lang=ar] .btn{letter-spacing:0;font-size:.9rem}
.btn:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold)}
.stage{position:relative;height:460px;display:grid;place-items:end center}
.stage .pedestal{position:absolute;bottom:0;width:62%;height:150px;background:linear-gradient(#f4ede0,#dccfb8);border-radius:50% 50% 12px 12px/22% 22% 12px 12px;box-shadow:0 30px 40px #00000018}
.stage .bagbox{position:relative;width:74%;margin-bottom:112px}
.stage .frame{position:absolute;width:88px;height:130px;border:5px solid #c9b48e;background:#f3ead9;top:34px}
.stage .frame.a{inset-inline-start:2%}.stage .frame.b{inset-inline-end:2%;top:20px;height:160px}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr;text-align:start;padding-block:40px}.stage{height:380px}}

/* trust strip */
.strip{background:var(--paper);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-block:26px}
.strip div{display:flex;gap:12px;align-items:flex-start;font-size:.8rem}
.strip svg{width:30px;height:30px;flex:none;color:var(--gold)}
.strip b{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
html[lang=ar] .strip b{letter-spacing:0;font-size:.85rem}
.strip span{color:var(--muted);font-size:.78rem;line-height:1.4;display:block}
@media(max-width:760px){.strip .wrap{grid-template-columns:1fr 1fr}}

/* split bands */
.split{display:grid;grid-template-columns:1fr 1fr;min-height:340px}
.split .img{background:var(--sand);display:grid;place-items:center;overflow:hidden}
.split .txt{padding:48px clamp(24px,6vw,72px);display:flex;flex-direction:column;justify-content:center;background:var(--cream)}
.split h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:6px}
.split p{color:var(--muted);font-size:.92rem;max-width:380px;margin-block:10px 20px}
.split.navy .txt{background:var(--navy);color:var(--sand)}
.split.navy p{color:#cfc7b6}
.split.navy .img{background:var(--navy-2)}
.link{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--gold);padding-bottom:3px;align-self:flex-start}
html[lang=ar] .link{letter-spacing:0;font-size:.85rem}
@media(max-width:760px){.split{grid-template-columns:1fr}}

/* collections + picks */
section.block{padding:54px 0 20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:12px}
.head h2{font-size:clamp(1.7rem,3.5vw,2.4rem)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.grid4{grid-template-columns:repeat(2,1fr)}}
.col{background:var(--paper);border:1px solid var(--line);text-align:center;cursor:pointer;transition:transform .25s,box-shadow .25s;padding:0}
.col:hover,.col.on{transform:translateY(-4px);box-shadow:0 14px 28px #0000001a}
.col.on{border-color:var(--gold)}
.col .ph{aspect-ratio:1;background:#fff}
.col span{display:block;padding:12px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border-top:1px solid var(--line)}
html[lang=ar] .col span{letter-spacing:0;font-size:.88rem}
.card{background:var(--paper);border:1px solid var(--line);position:relative;display:flex;flex-direction:column}
.card .ph{aspect-ratio:1;background:#fff}
.card .meta{padding:14px;border-top:1px solid var(--line);flex:1;display:flex;flex-direction:column;gap:4px}
.card h3{font-size:1.15rem}
.card p{font-size:.78rem;color:var(--muted);line-height:1.5;flex:1}
.card .add{margin-top:10px;background:transparent;border:1px solid var(--navy);color:var(--navy);padding:9px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;transition:.2s}
html[lang=ar] .card .add{letter-spacing:0;font-size:.85rem}
.card .add:hover{background:var(--navy);color:#fff}
.card .tag{position:absolute;inset-block-start:10px;inset-inline-start:10px;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
html[lang=ar] .tag{letter-spacing:0;font-size:.75rem}

/* service cards */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-block:50px 0}
.svc>div{background:var(--paper);border:1px solid var(--line);padding:24px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.svc h3{font-size:1.2rem;margin-bottom:4px}
.svc p{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.svc svg{width:96px;flex:none}
@media(max-width:860px){.svc{grid-template-columns:1fr}}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px 0;color:var(--muted);font-size:.74rem;text-align:center}
@media(max-width:760px){.perks{grid-template-columns:1fr 1fr}}

/* footer */
footer{background:var(--navy);color:#cfc7b6;margin-top:40px;padding:44px 0 24px}
footer .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:30px}
footer h4{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sand);margin-bottom:10px}
html[lang=ar] footer h4{letter-spacing:0;font-size:.9rem}
footer a{display:block;font-size:.84rem;padding-block:2px}
footer a:hover{color:#fff}
footer .logo{text-align:start;font-size:1.3rem}
footer small{display:block;text-align:center;margin-top:30px;font-size:.74rem;opacity:.6}
@media(max-width:760px){footer .wrap{grid-template-columns:1fr}}

/* cart drawer */
.veil{position:fixed;inset:0;background:#00000066;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(400px,100%);background:var(--cream);z-index:50;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer header h3{font-size:1.5rem}
.x{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--ink)}
.items{flex:1;overflow:auto;padding:14px 20px}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.it .ph{width:64px;height:64px;background:#fff;border:1px solid var(--line)}
.it b{font-family:var(--serif);font-size:1.05rem;font-weight:600;display:block;line-height:1.2}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:24px;height:24px;border:1px solid var(--line);background:#fff}
.rm{background:none;border:0;color:var(--muted);font-size:.78rem;text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.foot{padding:18px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.foot .btn{width:100%;text-align:center;background:#1f8f4e}
.foot .btn:disabled{opacity:.4;cursor:not-allowed}
.foot p{font-size:.78rem;color:var(--muted);text-align:center}
.toast{position:fixed;inset-block-end:20px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--navy);color:#fff;padding:12px 22px;font-size:.88rem;z-index:60;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <nav><a href="#collections" data-t="nav_col">Collections</a><a href="#picks" data-t="nav_picks">Curated</a><a href="#care" data-t="nav_care">Care</a></nav>
  <a href="#" class="logo">LALUNA</a>
  <div class="tools"><button class="pill" id="lang" type="button">English</button><button class="pill cartbtn" id="cartBtn" type="button"><span data-t="cart">Bag</span><b id="cnt">0</b></button></div>
</div></div>

<main>
<section class="hero"><div class="wrap">
  <div>
    <div class="eyebrow" data-t="hero_eye">La Luna</div>
    <h1 id="h1"></h1>
    <p data-t="hero_p"></p>
    <a class="btn" href="#picks" data-t="explore"></a>
  </div>
  <div class="stage">
    <div class="frame a"></div><div class="frame b"></div>
    <div class="pedestal"></div>
    <div class="bagbox" id="heroBag"></div>
  </div>
</div></section>

<div class="strip"><div class="wrap">
  <div><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M16 3l11 4v8c0 7-5 12-11 14C10 27 5 22 5 15V7z"/><path d="M11 15l4 4 7-8"/></svg><p><b data-t="s1_h"></b><span data-t="s1_p"></span></p></div>
  <div><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 26l12-12M20 6l6 6-4 4-6-6zM8 8l4 4"/></svg><p><b data-t="s2_h"></b><span data-t="s2_p"></span></p></div>
  <div><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="16" cy="16" r="11"/><path d="M16 9v7l5 3"/></svg><p><b data-t="s3_h"></b><span data-t="s3_p"></span></p></div>
  <div><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M16 4l3.5 7 7.5 1-5.5 5 1.5 8-7-4-7 4 1.5-8L5 12l7.5-1z"/></svg><p><b data-t="s4_h"></b><span data-t="s4_p"></span></p></div>
</div></div>

<div class="split">
  <div class="img" id="imgMat"></div>
  <div class="txt">
    <div class="eyebrow" data-t="mat_eye"></div>
    <h2 data-t="mat_h"></h2><div class="rule"></div>
    <p data-t="mat_p"></p>
    <a class="link" href="#picks" data-t="mat_link"></a>
  </div>
</div>
<div class="split navy">
  <div class="txt">
    <div class="eyebrow" data-t="cr_eye"></div>
    <h2 data-t="cr_h"></h2><div class="rule"></div>
    <p data-t="cr_p"></p>
  </div>
  <div class="img" id="imgCraft"></div>
</div>

<section class="block wrap" id="collections">
  <div class="eyebrow" data-t="col_eye"></div>
  <div class="head"><h2 data-t="col_h"></h2><a class="link" href="#picks" id="allBtn" data-t="view_all"></a></div>
  <div class="grid4" id="cols"></div>
</section>

<section class="block wrap" id="picks">
  <div class="eyebrow" data-t="pk_eye"></div>
  <div class="head"><h2 data-t="pk_h"></h2><a class="link" href="#" id="allBtn2" data-t="show_all"></a></div>
  <div class="grid4" id="grid"></div>

  <div class="svc" id="care">
    <div><div><div class="eyebrow" data-t="v1_eye"></div><h3 data-t="v1_h"></h3><p data-t="v1_p"></p><a class="link" href="#care" data-t="v1_l"></a></div><svg viewBox="0 0 100 70"><rect x="10" y="30" width="80" height="30" rx="4" fill="#d9c7a8"/><rect x="20" y="14" width="60" height="22" rx="4" fill="#b8873a"/></svg></div>
    <div><div><div class="eyebrow" data-t="v2_eye"></div><h3 data-t="v2_h"></h3><p data-t="v2_p"></p><a class="link" href="#contact" data-t="v2_l"></a></div><svg viewBox="0 0 100 70"><rect x="14" y="16" width="72" height="46" rx="3" fill="#12192e"/><rect x="14" y="16" width="72" height="14" fill="#1c2542"/><circle cx="50" cy="42" r="6" fill="#b8873a"/></svg></div>
    <div><div><div class="eyebrow" data-t="v3_eye"></div><h3 data-t="v3_h"></h3><p data-t="v3_p"></p><a class="link" href="#contact" data-t="v3_l"></a></div><svg viewBox="0 0 100 70"><rect x="12" y="14" width="76" height="48" rx="5" fill="#12192e" transform="rotate(-6 50 38)"/><text x="50" y="42" text-anchor="middle" font-size="9" letter-spacing="2" fill="#d9c7a8" font-family="serif" transform="rotate(-6 50 38)">LALUNA</text></svg></div>
  </div>
  <div class="perks"><span data-t="pf1"></span><span data-t="pf2"></span><span data-t="pf3"></span><span data-t="pf4"></span></div>
</section>
</main>

<footer id="contact"><div class="wrap">
  <div><div class="logo">LALUNA</div><p style="font-size:.84rem;margin-top:10px;max-width:260px" data-t="f_about"></p></div>
  <div><h4 data-t="f_shop"></h4><a href="#collections" data-t="nav_col"></a><a href="#picks" data-t="nav_picks"></a></div>
  <div><h4 data-t="f_help"></h4><a href="#" id="waLink" target="_blank" rel="noopener" data-t="f_wa"></a><a href="#care" data-t="nav_care"></a></div>
</div><small>© <span id="y"></span> La Luna</small></footer>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="cart">
  <header><h3 data-t="cart_h"></h3><button class="x" id="closeCart" type="button" aria-label="close">×</button></header>
  <div class="items" id="items"></div>
  <div class="foot"><button class="btn" id="send" type="button" data-t="send"></button><p data-t="send_note"></p></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ===== Edit only this block ===== */
const CONFIG = { phone: "000000000000" }; // WhatsApp number, digits with country code
/* ================================= */

/* ---------- drawn bag illustrations (white background, same front angle) ---------- */
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,k=Math.abs(p);
  r=Math.round((t-r)*k+r);g=Math.round((t-g)*k+g);b=Math.round((t-b)*k+b);return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
let uid=0;
function bag(type,base,gold="#c9a04a"){
  const id="g"+(++uid),d=shade(base,-.28),l=shade(base,.18);
  const defs=`<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient></defs>`;
  const shadow=`<ellipse cx="150" cy="262" rx="100" ry="9" fill="#000" opacity=".1"/>`;
  const lock=(y)=>`<rect x="138" y="${y}" width="24" height="20" rx="4" fill="${gold}"/><circle cx="150" cy="${y+10}" r="3.5" fill="${shade(gold,-.4)}"/>`;
  let body="";
  if(type==="tote") body=`<path d="M92 108C92 22 208 22 208 108" fill="none" stroke="${d}" stroke-width="9" stroke-linecap="round"/>
    <path d="M68 104H232L250 248Q251 258 240 258H60Q49 258 50 248Z" fill="${base}"/><path d="M68 104H232L234 124H66Z" fill="${d}"/>
    <path d="M68 104H232L250 248Q251 258 240 258H60Q49 258 50 248Z" fill="url(#${id})"/><circle cx="150" cy="170" r="9" fill="${gold}"/><path d="M96 124v128M204 124v128" stroke="${d}" stroke-width="1.2" opacity=".5"/>`;
  else if(type==="handle") body=`<path d="M100 124C100 44 200 44 200 124" fill="none" stroke="${d}" stroke-width="10" stroke-linecap="round"/>
    <rect x="52" y="122" width="196" height="136" rx="16" fill="${base}"/><path d="M52 140Q52 122 70 122H230Q248 122 248 140V176Q150 206 52 176Z" fill="${l}"/>
    <rect x="52" y="122" width="196" height="136" rx="16" fill="url(#${id})"/>${lock(176)}<path d="M62 190Q150 218 238 190" fill="none" stroke="${d}" stroke-width="1.2" opacity=".5"/>`;
  else if(type==="shoulder") body=`<path d="M78 126C78 22 222 22 222 126" fill="none" stroke="${d}" stroke-width="7" stroke-linecap="round"/>
    <path d="M62 122H238Q252 122 250 138L238 236Q235 258 213 258H87Q65 258 62 236L50 138Q48 122 62 122Z" fill="${base}"/>
    <path d="M62 122H238Q252 122 250 138L238 236Q235 258 213 258H87Q65 258 62 236L50 138Q48 122 62 122Z" fill="url(#${id})"/>
    <path d="M52 146Q150 168 248 146" fill="none" stroke="${d}" stroke-width="1.4"/><circle cx="150" cy="190" r="8" fill="${gold}"/>`;
  else body=`<path d="M82 148C82 70 218 70 218 148" fill="none" stroke="${gold}" stroke-width="5" stroke-dasharray="7 3" stroke-linecap="round"/>
    <rect x="62" y="146" width="176" height="108" rx="14" fill="${base}"/><path d="M62 160Q62 146 76 146H224Q238 146 238 160V200L150 220L62 200Z" fill="${l}"/>
    <rect x="62" y="146" width="176" height="108" rx="14" fill="url(#${id})"/>${lock(204)}<path d="M62 200L150 220L238 200" fill="none" stroke="${d}" stroke-width="1.2" opacity=".5"/>`;
  return `<svg viewBox="0 0 300 290" xmlns="http://www.w3.org/2000/svg" role="img">${defs}${shadow}${body}</svg>`;
}
const frame=(svg)=>`<div class="ph" style="display:grid;place-items:center;padding:8%">${svg}</div>`;

/* ---------- content ---------- */
const COLS=[
  {k:"everyday",type:"tote",c:"#b8733a",ar:"اليومية",en:"The Everyday"},
  {k:"icons",type:"handle",c:"#e4dac6",ar:"الأيقونات",en:"The Icons"},
  {k:"essentials",type:"shoulder",c:"#1b1b1f",ar:"الأساسيات",en:"The Essentials"},
  {k:"mini",type:"mini",c:"#cdb48f",ar:"الميني",en:"The Mini Edit"}
];

/* ---------- state ---------- */
let lang="ar",filter=null,cart=[];
try{lang=localStorage.getItem("ll_lang")||"ar";cart=JSON.parse(localStorage.getItem("ll_cart")||"[]")}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const nm=p=>p[lang][0],ds=p=>p[lang][1];
function save(){try{localStorage.setItem("ll_cart",JSON.stringify(cart));localStorage.setItem("ll_lang",lang)}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}

function render(){
  const d=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $$("[data-t]").forEach(el=>el.textContent=d[el.dataset.t]);
  $("#lang").textContent=lang==="ar"?"English":"العربية";
  $("#h1").innerHTML=`${d.h1[0]}<br>${d.h1[1]}<br><i>${d.h1[2]}</i>`;
  $("#heroBag").innerHTML=bag("handle","#b8733a");
  $("#imgMat").innerHTML=`<div style="width:62%;max-width:300px">${bag("handle","#a8643a")}</div>`;
  $("#imgCraft").innerHTML=`<div style="width:62%;max-width:300px">${bag("tote","#cdb48f")}</div>`;
  $("#cols").innerHTML=COLS.map(c=>`<div class="col ${filter===c.k?"on":""}" data-col="${c.k}" role="button" tabindex="0">${frame(bag(c.type,c.c))}<span>${c[lang]}</span></div>`).join("");
  const list=P.filter(p=>!filter||p.col===filter);
  $("#grid").innerHTML=list.map(p=>`<article class="card"><span class="tag">${COLS.find(c=>c.k===p.col)[lang]}</span>${frame(bag(p.type,p.c))}<div class="meta"><h3>${nm(p)}</h3><p>${ds(p)}</p><button class="add" data-add="${p.id}" type="button">${d.add}</button></div></article>`).join("");
  renderCart();
  const phone=CONFIG.phone;$("#waLink").href="https://wa.me/"+phone;
  document.title="La Luna";save();
}
function renderCart(){
  const d=T[lang],n=cart.reduce((a,i)=>a+i.q,0);
  $("#cnt").textContent=n;$("#send").disabled=!n;
  $("#items").innerHTML=cart.length?cart.map(i=>{const p=P.find(x=>x.id===i.id);return `<div class="it"><div class="ph" style="padding:4px">${bag(p.type,p.c)}</div><div><b>${nm(p)}</b><div class="qty"><button data-dec="${i.id}" type="button">−</button><span>${i.q}</span><button data-inc="${i.id}" type="button">+</button></div></div><button class="rm" data-rm="${i.id}" type="button">${d.remove}</button></div>`}).join(""):`<div class="empty">${d.empty}</div>`;
}
function openCart(o){$("#drawer").classList.toggle("on",o);$("#veil").classList.toggle("on",o)}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-add],[data-inc],[data-dec],[data-rm],[data-col]");
  if(t){
    const a=t.dataset;
    if(a.add){const i=cart.find(x=>x.id===a.add);i?i.q++:cart.push({id:a.add,q:1});toast(T[lang].added);save();renderCart()}
    else if(a.inc){cart.find(x=>x.id===a.inc).q++;save();renderCart()}
    else if(a.dec){const i=cart.find(x=>x.id===a.dec);if(--i.q<1)cart=cart.filter(x=>x!==i);save();renderCart()}
    else if(a.rm){cart=cart.filter(x=>x.id!==a.rm);save();renderCart()}
    else if(a.col){filter=filter===a.col?null:a.col;render();$("#picks").scrollIntoView({behavior:"smooth"})}
  }
});
$("#allBtn2").onclick=e=>{e.preventDefault();filter=null;render()};
$("#allBtn").onclick=()=>{filter=null;render()};
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render()};
$("#cartBtn").onclick=()=>openCart(true);
$("#closeCart").onclick=$("#veil").onclick=()=>openCart(false);
$("#send").onclick=()=>{
  const d=T[lang];if(!cart.length)return;
  const lines=cart.map(i=>{const p=P.find(x=>x.id===i.id);return `• ${nm(p)} — ${d.qty}: ${i.q}`});
  const url="https://wa.me/"+CONFIG.phone+"?text="+encodeURIComponent(d.wa_hi+"\n"+lines.join("\n"));
  window.open(url,"_blank","noopener");
  cart=[];save();renderCart();openCart(false);toast(d.sent);
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")openCart(false)});
$("#y").textContent=new Date().getFullYear();
render();
</script>
